name: Probe Check Worker

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "domain_len=${#DOMAIN}"
          URL="https://${DOMAIN}/check?sstp=vpn:vpn@public-vpn-114.opengw.net%3A443"
          echo "url=$URL"
          curl -sS -m 40 -o /tmp/out.txt -w "http_code=%{http_code}\n" "$URL" || echo "curl_exit=$?"
          echo "---- body head ----"
          head -c 600 /tmp/out.txt || true
          echo
          echo "---- root ----"
          curl -sS -m 30 -o /tmp/root.txt -w "root_code=%{http_code}\n" "https://${DOMAIN}/" || echo "root_fail=$?"
          head -c 300 /tmp/root.txt || true
